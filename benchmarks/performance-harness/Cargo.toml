[package]
name = "canwu-performance-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

# Keep this profiling utility outside the production workspace. CI validates
# the engine workspace; maintainers run this harness deliberately in release
# mode when recording an architectural baseline.
[workspace]

[features]
default = ["compact-fork"]
allocation-counting = []
# `keyed-draw-profile` measures `CompactedCanwu::fork`, which engines before
# 0.16.0 lack; build their exports with `--no-default-features`.
compact-fork = []

[dependencies]
canwu-api = { path = "../../crates/api/canwu-api" }
canwu-fiscal = { path = "../../crates/extensions/canwu-fiscal" }
canwu-information = { path = "../../crates/extensions/canwu-information" }
blake3 = "1"
canwu-history-research = { path = "../../crates/extensions/canwu-history-research" }
canwu-technology = { path = "../../crates/extensions/canwu-technology" }
canwu-production = { path = "../../crates/extensions/canwu-production" }
canwu-resource = { path = "../../crates/extensions/canwu-resource" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
