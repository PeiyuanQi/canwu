[workspace]
members = [
    "crates/canwu-api",
    "crates/canwu-core",
    "crates/canwu-decision",
    "crates/canwu-debug",
    "crates/canwu-event",
    "crates/canwu-information",
    "crates/canwu-knowledge",
    "crates/canwu-routing",
    "crates/canwu-sim",
    "crates/canwu-society",
    "crates/canwu-transport",
    "crates/canwu-time",
    "crates/canwu-world",
]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PeiyuanQi/canwu"
homepage = "https://canwu.org"
readme = "README.md"
keywords = ["simulation", "history", "deterministic", "game-engine"]
categories = ["simulation", "game-development"]
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1"
canwu-api = { path = "crates/canwu-api", version = "=0.5.1" }
canwu-core = { path = "crates/canwu-core", version = "=0.5.1" }
canwu-decision = { path = "crates/canwu-decision", version = "=0.5.1" }
canwu-event = { path = "crates/canwu-event", version = "=0.5.1" }
canwu-information = { path = "crates/canwu-information", version = "=0.5.1" }
canwu-knowledge = { path = "crates/canwu-knowledge", version = "=0.5.1" }
canwu-routing = { path = "crates/canwu-routing", version = "=0.5.1" }
canwu-sim = { path = "crates/canwu-sim", version = "=0.5.1" }
canwu-society = { path = "crates/canwu-society", version = "=0.5.1" }
canwu-time = { path = "crates/canwu-time", version = "=0.5.1" }
canwu-transport = { path = "crates/canwu-transport", version = "=0.5.1" }
canwu-world = { path = "crates/canwu-world", version = "=0.5.1" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
