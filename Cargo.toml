[workspace]
members = [
    "crates/foundation/canwu-core",
    "crates/foundation/canwu-time",
    "crates/model/canwu-decision",
    "crates/model/canwu-event",
    "crates/model/canwu-knowledge",
    "crates/mechanisms/canwu-routing",
    "crates/mechanisms/canwu-transport",
    "crates/runtime/canwu-sim",
    "crates/api/canwu-api",
    "crates/extensions/canwu-information",
    "crates/extensions/canwu-history-research",
    "crates/extensions/canwu-correspondence",
    "crates/extensions/canwu-culture",
    "crates/extensions/canwu-society",
    "crates/extensions/canwu-technology",
    "crates/extensions/canwu-fiscal",
    "crates/extensions/canwu-resource",
    "crates/extensions/canwu-production",
    "crates/reference-content/canwu-ming-fiscal",
    "crates/reference-content/canwu-economy-reference-content",
    "crates/extensions/canwu-law",
    "crates/extensions/canwu-military",
    "crates/reference-content/canwu-military-reference-content",
    "crates/integrations/canwu-reference-world",
    "crates/integrations/canwu-military-reference",
    "crates/integrations/canwu-ming-fiscal-reference",
    "crates/integrations/canwu-force-supply-reference",
    "crates/integrations/canwu-economy-reference",
    "crates/tools/canwu-debug",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/PeiyuanQi/canwu"
homepage = "https://canwu.org"
readme = "README.md"
keywords = ["simulation", "history", "deterministic", "game-engine"]
categories = ["simulation", "game-development"]
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1"
im = { version = "15", features = ["serde"] }
canwu-api = { path = "crates/api/canwu-api", version = "=0.10.0" }
canwu-core = { path = "crates/foundation/canwu-core", version = "=0.10.0" }
canwu-decision = { path = "crates/model/canwu-decision", version = "=0.10.0" }
canwu-event = { path = "crates/model/canwu-event", version = "=0.10.0" }
canwu-information = { path = "crates/extensions/canwu-information", version = "=0.10.0" }
canwu-history-research = { path = "crates/extensions/canwu-history-research", version = "=0.10.0" }
canwu-correspondence = { path = "crates/extensions/canwu-correspondence", version = "=0.10.0" }
canwu-culture = { path = "crates/extensions/canwu-culture", version = "=0.10.0" }
canwu-knowledge = { path = "crates/model/canwu-knowledge", version = "=0.10.0" }
canwu-reference-world = { path = "crates/integrations/canwu-reference-world", version = "=0.10.0" }
canwu-routing = { path = "crates/mechanisms/canwu-routing", version = "=0.10.0" }
canwu-sim = { path = "crates/runtime/canwu-sim", version = "=0.10.0" }
canwu-society = { path = "crates/extensions/canwu-society", version = "=0.10.0" }
canwu-technology = { path = "crates/extensions/canwu-technology", version = "=0.10.0" }
canwu-fiscal = { path = "crates/extensions/canwu-fiscal", version = "=0.10.0" }
canwu-resource = { path = "crates/extensions/canwu-resource", version = "=0.10.0" }
canwu-production = { path = "crates/extensions/canwu-production", version = "=0.10.0" }
canwu-law = { path = "crates/extensions/canwu-law", version = "=0.10.0" }
canwu-military = { path = "crates/extensions/canwu-military", version = "=0.10.0" }
canwu-military-reference-content = { path = "crates/reference-content/canwu-military-reference-content", version = "=0.10.0" }
canwu-military-reference = { path = "crates/integrations/canwu-military-reference", version = "=0.10.0" }
canwu-ming-fiscal = { path = "crates/reference-content/canwu-ming-fiscal", version = "=0.10.0" }
canwu-economy-reference-content = { path = "crates/reference-content/canwu-economy-reference-content", version = "=0.10.0" }
canwu-ming-fiscal-reference = { path = "crates/integrations/canwu-ming-fiscal-reference", version = "=0.10.0" }
canwu-force-supply-reference = { path = "crates/integrations/canwu-force-supply-reference", version = "=0.10.0" }
canwu-economy-reference = { path = "crates/integrations/canwu-economy-reference", version = "=0.10.0" }
canwu-time = { path = "crates/foundation/canwu-time", version = "=0.10.0" }
canwu-transport = { path = "crates/mechanisms/canwu-transport", version = "=0.10.0" }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
